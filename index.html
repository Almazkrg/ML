<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Classifier</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    .ok { background: #e6f4ea; } .err { background: #fdecea; }
  </style>
</head>
<body>
  <h1>Iris Classifier</h1>
  <label>Sepal length <input id="sl" type="number" step="0.1" value="5.1"></label>
  <label>Sepal width <input id="sw" type="number" step="0.1" value="3.5"></label>
  <label>Petal length <input id="pl" type="number" step="0.1" value="1.4"></label>
  <label>Petal width <input id="pw" type="number" step="0.1" value="0.2"></label>
  <button onclick="predict()">Predict</button>
  <div id="result"></div>

  <script>
    async function predict() {
      const box = document.getElementById("result");
      const body = {
        sepal_length: parseFloat(document.getElementById("sl").value),
        sepal_width: parseFloat(document.getElementById("sw").value),
        petal_length: parseFloat(document.getElementById("pl").value),
        petal_width: parseFloat(document.getElementById("pw").value),
      };
      try {
        const r = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        box.className = "ok";
        box.textContent = "Class: " + d.class_name + " (probability: " + d.probability + ")";
      } catch (e) {
        box.className = "err";
        box.textContent = "Error: " + e.message;
      }
      box.style.display = "block";
    }
  </script>
</body>
</html>
